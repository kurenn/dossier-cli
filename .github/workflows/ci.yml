name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. Nothing in this workflow writes to the repository, and a token
# that cannot write cannot be used to push a malicious commit if a dependency in the
# build is ever compromised.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The gate from the dev-loop profile. Kept here rather than in a script so a change to
  # it shows up in a diff of the workflow.
  COVERAGE_FLOOR: "85.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          # From go.mod, so the toolchain CI uses and the one the module declares can
          # never drift apart.
          go-version-file: go.mod
          cache: true

      # Formatting is checked rather than applied: a CI job that rewrites source is a CI
      # job that hides the fact nobody ran gofmt.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The contract suite is excluded from every step above by its build tag, because it
      # needs a live server this runner has none of — it runs in the API's repository.
      # Vetting it with the tag on is what stops it rotting: without this, a rename here
      # would compile fine for months and then fail in *that* repository's CI, which is
      # the worst place to discover it.
      - name: go vet (contract suite)
        run: go vet -tags contract ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

      # -race because the retry path sleeps and the transport is the kind of code that
      # grows goroutines later; catching a data race the first time one appears is much
      # cheaper than catching it in a flake.
      #
      # -coverpkg=./... because most of the transport and store code is exercised through
      # the command tests. Per-package coverage would report those packages as thinly
      # tested and this gate would be measuring the wrong thing.
      - name: test
        run: go test ./... -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out

      - name: coverage gate
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')"
          echo "Total coverage: ${total}%  (floor ${COVERAGE_FLOOR}%)"
          awk -v total="$total" -v floor="$COVERAGE_FLOOR" \
            'BEGIN { exit !(total + 0 >= floor + 0) }' \
            || { echo "Coverage ${total}% is below the ${COVERAGE_FLOOR}% floor."; exit 1; }

      # Proves the thing users actually install still builds, and that the version stamp
      # the release process depends on is wired up.
      - name: build
        run: go build -ldflags "-X main.version=ci-${GITHUB_SHA::7}" -o /tmp/dossier ./cmd/dossier

      - name: smoke
        run: |
          /tmp/dossier version
          # `schema` is the one command that works with no token and no network profile;
          # with no host reachable it must fail cleanly as exit 1, not panic.
          set +e
          /tmp/dossier schema --host http://127.0.0.1:1 >/dev/null 2>&1
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "An unreachable host gave exit ${code}, want 1."
            exit 1
          fi

  # Windows is a release target, and the only platform-specific code in the repository is
  # the credentials ACL — the part that decides whether a token on disk is exposed.
  #
  # Cross-compiling it from the Linux job proves it type-checks, which is close to
  # worthless for this particular code: every mistake it can make is a runtime one about
  # SIDs and access masks, and `GOOS=windows go vet` would happily pass a check that
  # refuses every file or accepts every file. It has to actually run somewhere.
  #
  # Only the store package, because that is where the platform code and its tests live.
  # The rest of the suite is about the command surface, which is the same everywhere, and
  # the two tests in it that do assert file permissions skip here and say why.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: test (store)
        run: go test ./internal/store/... -race

      # The release ships a windows/amd64 binary; this is the cheapest possible proof
      # that it links and starts.
      - name: smoke
        run: |
          go build -o dossier.exe ./cmd/dossier
          ./dossier.exe version

  # The release configuration, checked on every push rather than discovered at tag time.
  #
  # `goreleaser check` fails on deprecated keys, and GoReleaser turns soft deprecations
  # into hard errors on a schedule of its own — `brews` went from a warning to a build
  # failure in one minor version. Finding that here costs a red PR; finding it during a
  # release means the tag is already pushed and the fix has to be re-tagged.
  #
  # The build is a snapshot with publishing and signing skipped, so it needs no secrets
  # and no OIDC token, and it exercises the part most likely to break silently: whether
  # all five targets actually cross-compile.
  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,sign

      # The binary that ships must carry the version it claims. `main.version` defaults
      # to "dev", and a broken ldflags stanza produces a perfectly working release whose
      # every binary reports "dev" — which is only discoverable by running one.
      - name: the version stamp reached the binary
        run: |
          stamped="$(./dist/dossier_linux_amd64_v1/dossier version | awk '/^DOSSIER/ {print $2}')"
          echo "Snapshot build reports: ${stamped}"
          if [ "$stamped" = "dev" ] || [ -z "$stamped" ]; then
            echo "The build did not stamp a version; check the ldflags in .goreleaser.yaml."
            exit 1
          fi

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Separate job so a vulnerability in a dependency is reported even when a test is
      # failing for an unrelated reason — the two answer different questions and one
      # should not mask the other.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
